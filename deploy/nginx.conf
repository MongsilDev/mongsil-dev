# mongsil.dev 정적 사이트 서빙 (Synology NAS, nginx:alpine 컨테이너)
# 컨테이너: /volume1/docker/mongsil-dev/out -> /usr/share/nginx/html (ro)
# 게시 포트: 127.0.0.1:8083 -> 80  (Cloudflare Tunnel이 여기로 프록시)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Next 정적 export의 404 페이지
    error_page 404 /404.html;

    # Next는 메타 이미지를 확장자 없이 내보냄 -> MIME을 명시하지 않으면
    # application/octet-stream 으로 나가서 OG 미리보기/아이콘이 깨진다.
    location = /opengraph-image {
        default_type image/png;
    }
    location = /apple-icon {
        default_type image/png;
    }

    # 해시가 붙은 불변 에셋은 장기 캐시
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # HTML은 매번 재검증 — 배포 후 옛 HTML이 삭제된 해시 청크를 참조하지 않도록
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    # woff2는 이미 압축되어 있어 gzip 대상에서 제외
}
